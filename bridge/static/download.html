<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件下载 - FileFlow Bridge</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        h1 {
            color: #4a5568;
            margin-bottom: 24px;
            font-size: 28px;
        }

        .file-info {
            background: #f7fafc;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }

        .file-info p {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
        }

        .file-info strong {
            color: #2d3748;
        }

        .file-info span {
            color: #4a5568;
        }

        .download-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin: 20px 0;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .download-btn:active {
            transform: scale(0.98);
        }

        .direct-link {
            display: block;
            color: #667eea;
            text-decoration: none;
            margin: 15px 0;
            font-weight: 500;
        }

        .direct-link:hover {
            text-decoration: underline;
        }

        .qr-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .qr-title {
            font-size: 16px;
            color: #718096;
            margin-bottom: 15px;
        }

        .qr-code {
            display: inline-block;
            padding: 10px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #718096;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .warning {
            color: #e53e3e;
            font-size: 14px;
            margin-top: 15px;
            padding: 10px;
            background: #fef2f2;
            border-radius: 6px;
            border-left: 4px solid #e53e3e;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
                margin: 15px;
            }

            h1 {
                font-size: 24px;
            }

            .download-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📥 文件下载</h1>

        <div class="file-info">
            <p><strong>文件名:</strong> <span id="filename">{{ORIGINAL_FILENAME}}</span></p>
            <p><strong>文件大小:</strong> <span id="filesize">{{FILESIZE_HUMAN}}</span></p>
            <p><strong>文件ID:</strong> <span id="fileid">{{TOKEN}}</span></p>
            <p><strong>上传时间:</strong> <span id="uploadtime">-</span></p>
        </div>

        <button class="download-btn" onclick="downloadFile()">
            <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
            </svg>
            点击下载文件
        </button>

        <div class="warning">
            ⚠️ 注意：此链接将在2小时后过期，请及时下载！
        </div>

        <div class="qr-section">
            <div class="qr-title">📱 扫码在移动端下载</div>
            <div class="qr-code" id="qrcode"></div>
        </div>

        <a href="/" class="back-link">← 返回首页</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('uploadtime').textContent = new Date().toLocaleString();

            // 生成二维码：指向当前下载页面 URL
            var token = document.getElementById('fileid').textContent;
            var filename = document.getElementById('filename').textContent;
            var downloadUrl = window.location.origin + '/download/' + token + '/' + encodeURIComponent(filename);

            var qr = qrcode(0, 'M');
            qr.addData(downloadUrl);
            qr.make();
            document.getElementById('qrcode').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2 });
        });

        function downloadFile() {
            var token = document.getElementById('fileid').textContent;
            var filename = document.getElementById('filename').textContent;
            var downloadUrl = '/download/' + token + '/' + encodeURIComponent(filename);
            var link = document.createElement('a');
            link.href = downloadUrl;
            link.download = filename;
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
