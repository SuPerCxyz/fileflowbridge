<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件下载 - FileFlow Bridge</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        h1 {
            color: #4a5568;
            margin-bottom: 24px;
            font-size: 28px;
        }

        .file-info {
            background: #f7fafc;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }

        .file-info p {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
        }

        .file-info strong {
            color: #2d3748;
        }

        .file-info span {
            color: #4a5568;
        }

        .download-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin: 20px 0;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .download-btn:active {
            transform: scale(0.98);
        }

        .direct-link {
            display: block;
            color: #667eea;
            text-decoration: none;
            margin: 15px 0;
            font-weight: 500;
        }

        .direct-link:hover {
            text-decoration: underline;
        }

        .qr-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .qr-title {
            font-size: 16px;
            color: #718096;
            margin-bottom: 15px;
        }

        .qr-code {
            display: inline-block;
            padding: 10px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #718096;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .warning {
            color: #e53e3e;
            font-size: 14px;
            margin-top: 15px;
            padding: 10px;
            background: #fef2f2;
            border-radius: 6px;
            border-left: 4px solid #e53e3e;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
                margin: 15px;
            }

            h1 {
                font-size: 24px;
            }

            .download-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📥 文件下载</h1>

        <div class="file-info">
            <p><strong>文件名:</strong> <span id="filename">{{ORIGINAL_FILENAME}}</span></p>
            <p><strong>文件大小:</strong> <span id="filesize">{{FILESIZE_HUMAN}}</span></p>
            <p><strong>文件ID:</strong> <span id="fileid">{{TOKEN}}</span></p>
            <p><strong>上传时间:</strong> <span id="uploadtime">-</span></p>
        </div>

        <button class="download-btn" onclick="downloadFile()">
            <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
            </svg>
            点击下载文件
        </button>

        <a href="/download/{{TOKEN}}/{{FILENAME}}" id="directDownloadLink" class="direct-link">直接下载链接</a>

        <div class="warning">
            ⚠️ 注意：此链接将在2小时后过期，请及时下载！
        </div>

        <div class="qr-section">
            <div class="qr-title">📱 扫码在移动端下载</div>
            <div class="qr-code">
                <canvas id="qrcode" width="150" height="150"></canvas>
            </div>
        </div>

        <a href="/" class="back-link">← 返回首页</a>
    </div>

    <script>
        // 页面加载后更新时间
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('uploadtime').textContent = new Date().toLocaleString();
        });

        function downloadFile() {
            // 构建下载URL，使用当前页面的认证令牌
            const token = document.getElementById('fileid').textContent;
            const filename = document.getElementById('filename').textContent;

            const downloadUrl = `/download/${token}/${encodeURIComponent(filename)}`;

            // 创建临时链接并触发下载
            const link = document.createElement('a');
            link.href = downloadUrl;
            link.download = filename;
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function generateQRCode() {
            const canvas = document.getElementById('qrcode');
            const ctx = canvas.getContext('2d');

            // 简化版二维码生成 - 实际部署时应使用专门的库如qrcode.js
            // 这里只是简单展示二维码效果，实际应该引入qrcode.js库
            drawSimpleQRCode(ctx, canvas.width, canvas.height);
        }

        function drawSimpleQRCode(ctx, width, height) {
            // 清空画布
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);

            // 绘制简化版二维码边框
            ctx.fillStyle = '#000000';

            // 角落定位图案
            drawPositionMarker(ctx, 10, 10);
            drawPositionMarker(ctx, width - 40, 10);
            drawPositionMarker(ctx, 10, height - 40);

            // 填充一些随机方块模拟二维码
            for (let x = 0; x < width; x += 10) {
                for (let y = 0; y < height; y += 10) {
                    if (Math.random() > 0.6 && !isPositionMarkerArea(x, y, width, height)) {
                        ctx.fillRect(x, y, 8, 8);
                    }
                }
            }
        }

        function drawPositionMarker(ctx, x, y) {
            ctx.fillStyle = '#000000';
            // 外框
            ctx.fillRect(x, y, 30, 30);
            // 内框
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(x + 5, y + 5, 20, 20);
            // 中心点
            ctx.fillStyle = '#000000';
            ctx.fillRect(x + 10, y + 10, 10, 10);
        }

        function isPositionMarkerArea(x, y, width, height) {
            return (x <= 40 && y <= 40) ||
                   (x >= width - 50 && y <= 40) ||
                   (x <= 40 && y >= height - 50);
        }

        // 生成二维码
        generateQRCode();
    </script>
</body>
</html>
