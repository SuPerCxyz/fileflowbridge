<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <title>下载命令行工具 - FileFlow Bridge</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --surface: #ffffff;
      --surface-2: #f7fafc;
      --text: #2d3748;
      --text-secondary: #4a5568;
      --text-tertiary: #718096;
      --border: #e2e8f0;
      --border-strong: #cbd5e0;
      --accent: #667eea;
      --accent-2: #764ba2;
      --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --success: #38a169;
      --success-bg: #c6f6d5;
      --error: #e53e3e;
      --error-bg: #fed7d7;
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.06);
      --radius: 15px;
      --code-bg: #1e2430;
      --code-text: #e2e8f0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: 100%;
      max-width: 640px;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px;
    }

    header { margin-bottom: 24px; text-align: center; }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 8px;
    }

    h1 {
      color: var(--text-secondary);
      font-size: 2.2em;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--text-tertiary);
      font-size: 1.05em;
      margin-top: 6px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 24px;
      border: none;
      border-radius: 25px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.15s ease;
      min-height: 40px;
    }

    .btn-primary {
      background: var(--accent-gradient);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text-secondary);
      border: 1px solid var(--border-strong);
    }

    .btn-secondary:hover:not(:disabled) { background: var(--border); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow-card);
      padding: 20px;
      margin-bottom: 16px;
    }

    .recommend {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), var(--shadow-card);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-meta {
      font-size: 0.85rem;
      color: var(--text-tertiary);
      margin-bottom: 12px;
    }

    .platform-badge {
      display: inline-block;
      padding: 2px 8px;
      background: var(--accent);
      color: #fff;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .platform-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    @media (max-width: 600px) {
      .platform-grid { grid-template-columns: 1fr; }
      .app { padding: 20px; margin: 10px; }
      h1 { font-size: 1.8em; }
    }

    .platform-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .platform-btn:hover {
      border-color: var(--accent);
      background: var(--surface);
    }

    .platform-btn.current {
      border-color: var(--accent);
      background: var(--accent-gradient);
      color: #fff;
      font-weight: 600;
    }

    .platform-btn.current .size {
      color: rgba(255, 255, 255, 0.8);
    }

    .platform-btn .size {
      font-size: 0.8rem;
      color: var(--text-tertiary);
      font-weight: 400;
    }

    .status-msg {
      font-size: 0.9rem;
      padding: 10px 12px;
      border-radius: 8px;
      display: none;
    }

    .status-msg.show { display: block; }
    .status-msg.error { color: var(--error); background: var(--error-bg); }
    .status-msg.info { color: var(--text-secondary); background: var(--surface-2); }

    .usage {
      margin-top: 8px;
    }

    .usage h3 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--text-secondary);
    }

    .code-block {
      background: var(--code-bg);
      color: var(--code-text);
      padding: 14px 16px;
      border-radius: 8px;
      font-family: "SF Mono", "Cascadia Code", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.85rem;
      overflow-x: auto;
      white-space: pre;
      line-height: 1.6;
    }

    .code-block .cmt { color: #7a8896; }
    .code-block .var { color: #7ee787; }

    .copy-btn {
      float: right;
      padding: 4px 10px;
      font-size: 0.8rem;
      min-height: 28px;
      margin-bottom: 8px;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--border-strong);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>📥 命令行工具</h1>
      <p class="subtitle">fileflowprovider - 终端上传文件到 FileFlow Bridge</p>
    </header>

    <div id="statusMsg" class="status-msg"></div>

    <div class="card">
      <div class="card-title">所有平台</div>
      <div class="card-meta" id="releaseMeta">加载中...</div>
      <div id="platformGrid" class="platform-grid">
        <span class="spinner"></span>
      </div>
    </div>

    <div class="card usage">
      <h3>使用方法</h3>
      <div id="usageCode" class="code-block"></div>
    </div>

    <div class="bottom-bar">
      <a href="/" class="btn btn-secondary">← 返回上传</a>
      <button id="copyUsage" class="btn btn-secondary">复制</button>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const statusMsg = document.getElementById('statusMsg');
      const releaseMeta = document.getElementById('releaseMeta');
      const platformGrid = document.getElementById('platformGrid');
      const usageCode = document.getElementById('usageCode');
      const copyUsage = document.getElementById('copyUsage');

      function showMsg(text, type) {
        statusMsg.textContent = text;
        statusMsg.className = 'status-msg show ' + (type || 'info');
      }

      function clearMsg() {
        statusMsg.className = 'status-msg';
        statusMsg.textContent = '';
      }

      function fmtBytes(bytes) {
        if (!bytes) return '';
        const units = ['B', 'KiB', 'MiB', 'GiB'];
        const i = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
        return (bytes / Math.pow(1024, i)).toFixed(i > 0 ? 2 : 0) + ' ' + units[i];
      }

      // 从 UA 检测当前平台
      function detectPlatform() {
        const ua = navigator.userAgent.toLowerCase();
        const arch = (navigator.userAgentData && navigator.userAgentData.platform || '').toLowerCase();
        let os = 'linux';
        if (ua.indexOf('win') !== -1) os = 'windows';
        else if (ua.indexOf('mac') !== -1) os = 'darwin';
        else if (ua.indexOf('linux') !== -1 || ua.indexOf('x11') !== -1) os = 'linux';

        let cpu = 'amd64';
        if (ua.indexOf('arm64') !== -1 || ua.indexOf('aarch64') !== -1 ||
            arch.indexOf('arm64') !== -1 || arch.indexOf('aarch64') !== -1) {
          cpu = 'arm64';
        }
        return { os: os, arch: cpu };
      }

      const platformLabels = {
        'linux-amd64': 'Linux x86_64',
        'linux-arm64': 'Linux ARM64',
        'darwin-amd64': 'macOS Intel',
        'darwin-arm64': 'macOS Apple Silicon',
        'windows-amd64': 'Windows x86_64',
        'windows-arm64': 'Windows ARM64',
      };

      function matchAsset(assets, os, arch) {
        // 资产名格式: fileflowprovider-{version}-{os}-{arch}[.exe]
        // 用 -{os}-{arch} 匹配，跳过中间的版本号
        var suffix = '-' + os + '-' + arch;
        for (const a of assets) {
          var n = a.name.toLowerCase();
          if (n.indexOf(suffix) !== -1) return a;
        }
        return null;
      }

      function buildUsage(serverBase) {
        const cur = detectPlatform();
        const isWin = cur.os === 'windows';
        const binName = isWin ? 'fileflowprovider.exe' : 'fileflowprovider';
        const url = serverBase || 'https://ffb.soocoo.xyz';
        const lines = [];
        if (isWin) {
          lines.push('<span class="cmt"># Windows: 在 PowerShell 或 CMD 中运行</span>');
          lines.push('<span class="var">&gt;</span> .\\' + binName + ' ' + url + ' .\\你的文件.zip');
          lines.push('');
          lines.push('<span class="cmt"># 终端会输出下载链接，发送给接收者即可</span>');
        } else {
          lines.push('<span class="cmt"># 1. 下载后赋予执行权限（Linux / macOS）</span>');
          lines.push('<span class="var">$</span> chmod +x ' + binName);
          lines.push('');
          lines.push('<span class="cmt"># 2. 上传文件</span>');
          lines.push('<span class="var">$</span> ./' + binName + ' ' + url + ' ./你的文件.zip');
          lines.push('');
          lines.push('<span class="cmt"># 3. 终端会输出下载链接，发送给接收者即可</span>');
        }
        return lines.join('\n');
      }

      async function load() {
        try {
          const resp = await fetch('/cli/releases/latest', { cache: 'no-store' });
          if (!resp.ok) {
            showMsg('无法获取 Release 信息 (HTTP ' + resp.status + ')', 'error');
            platformGrid.innerHTML = '<span style="color: var(--text-tertiary); font-size: 0.85rem;">暂无可用版本</span>';
            return;
          }
          const data = await resp.json();
          clearMsg();

          const tag = data.tag_name || data.name || 'latest';
          const date = data.published_at ? new Date(data.published_at).toLocaleDateString('zh-CN') : '';
          releaseMeta.textContent = '版本 ' + tag + (date ? ' · 发布于 ' + date : '') + ' · 共 ' + (data.assets ? data.assets.length : 0) + ' 个文件';

          const assets = (data.assets || []).filter(function (a) {
            return a.name.indexOf('fileflowprovider') !== -1;
          });

          if (!assets.length) {
            platformGrid.innerHTML = '<span style="color: var(--text-tertiary); font-size: 0.85rem;">此版本未包含 fileflowprovider 资产</span>';
            return;
          }

          const cur = detectPlatform();

          platformGrid.innerHTML = '';
          const keys = Object.keys(platformLabels);
          for (const key of keys) {
            const parts = key.split('-');
            const os = parts[0];
            const arch = parts[1];
            const a = matchAsset(assets, os, arch);
            if (!a) continue;
            const isCurrent = (os === cur.os && arch === cur.arch);
            const btn = document.createElement('a');
            btn.className = 'platform-btn' + (isCurrent ? ' current' : '');
            btn.href = a.browser_download_url;
            btn.download = '';
            btn.innerHTML = '<span>' + (platformLabels[key] || key) + (isCurrent ? ' ✓' : '') + '</span>' +
              '<span class="size">' + fmtBytes(a.size) + '</span>';
            platformGrid.appendChild(btn);
          }

          const serverBase = window.location.origin;
          usageCode.innerHTML = buildUsage(serverBase);
        } catch (err) {
          showMsg('加载失败: ' + (err.message || err), 'error');
        }
      }

      copyUsage.addEventListener('click', async function () {
        const text = usageCode.textContent;
        let ok = false;
        if (navigator.clipboard && window.isSecureContext) {
          try { await navigator.clipboard.writeText(text); ok = true; } catch {}
        }
        if (!ok) {
          try {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed'; ta.style.top = '-9999px'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            ok = document.execCommand('copy');
            document.body.removeChild(ta);
          } catch {}
        }
        if (ok) {
          copyUsage.textContent = '已复制';
          setTimeout(function () { copyUsage.textContent = '复制'; }, 1500);
        }
      });

      load();
    })();
  </script>
</body>
</html>
